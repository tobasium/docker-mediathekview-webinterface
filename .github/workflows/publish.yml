name: Publish tagged image to GHCR

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tobasium/docker-mediathekview-webinterface:${{ github.ref_name }}
