name: Build and publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MediathekView version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^ENV MEDIATHEK_VERSION=//p' Dockerfile)"
          if [[ -z "$version" ]]; then
            echo "::error::MEDIATHEK_VERSION is missing from Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tobasium/docker-mediathekview-webinterface:latest
            ghcr.io/tobasium/docker-mediathekview-webinterface:${{ steps.version.outputs.version }}
